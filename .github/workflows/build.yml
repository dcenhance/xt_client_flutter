name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev patchelf rpm libasound2-dev libmpv-dev imagemagick librsvg2-bin
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package every Linux format
        env:
          TOOLS_DIR: ${{ runner.temp }}/tools
        run: |
          mkdir -p "$TOOLS_DIR"
          curl -sSL -o "$TOOLS_DIR/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$TOOLS_DIR/appimagetool"
          ./tool/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/dist/*.tar.gz
            build/dist/*.tar.xz
            build/dist/*.deb
            build/dist/*.rpm
            build/dist/*.AppImage

  windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath build\dist\spectre-windows-x64-portable.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tool\windows-installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/dist/*.zip
            build/dist/*setup.exe

  android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Universal APK
        run: flutter build apk --release
      - name: Per-ABI APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
      - name: Play Store bundle
        run: flutter build appbundle --release
      - name: Collect artifacts
        run: |
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/spectre-universal.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$f" "build/dist/spectre-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab build/dist/spectre.aab
          ls -lh build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/dist/*

  apple:
    needs: analyze-and-test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: macOS app
        run: flutter build macos --release
      - name: iOS app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package zip and dmg
        run: |
          mkdir -p build/dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Spectre.app \
            build/dist/spectre-macos-x64.app.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/dist/spectre-ios-unsigned.app.zip
          mkdir -p build/dmg && cp -R build/macos/Build/Products/Release/Spectre.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Spectre" -srcfolder build/dmg -ov -format UDZO \
            build/dist/spectre-macos-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: build/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*