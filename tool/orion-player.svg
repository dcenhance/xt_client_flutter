<?xml version="1.0" encoding="UTF-8"?>
<!--
  Orion Player mark, v2.
  A deep-black squircle with a warm inner glow, a thick gold orbital ring, a
  bold play glyph that breaks the ring, and the three belt stars riding the arc.
  Deliberately few, large shapes so it still reads at 48 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="base" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#241C11"/>
      <stop offset="0.45" stop-color="#100D0A"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF0C9"/>
      <stop offset="0.35" stop-color="#EFCB80"/>
      <stop offset="0.7" stop-color="#C89A47"/>
      <stop offset="1" stop-color="#8A6224"/>
    </linearGradient>
    <linearGradient id="play" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFEFC4"/>
      <stop offset="0.5" stop-color="#F2CE84"/>
      <stop offset="1" stop-color="#B8862F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2CE84" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#F2CE84" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F2CE84" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#base)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#sheen)"/>

  <!-- warm glow behind the mark -->
  <circle cx="256" cy="266" r="196" fill="url(#glow)"/>

  <!-- orbital ring, broken where the play glyph crosses it -->
  <circle cx="256" cy="268" r="150" fill="none" stroke="url(#ring)" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="700 260" stroke-dashoffset="-215"/>

  <!-- play glyph -->
  <path d="M215 196 L215 340 L343 268 Z" fill="url(#play)"/>

  <!-- belt stars on the upper arc -->
  <g fill="url(#ring)">
    <circle cx="176" cy="163" r="15"/>
    <circle cx="256" cy="140" r="19"/>
    <circle cx="336" cy="163" r="13"/>
  </g>

  <!-- inner border -->
  <rect x="6" y="6" width="500" height="500" rx="113" fill="none"
        stroke="#F2CE84" stroke-opacity="0.30" stroke-width="3"/>
</svg>
