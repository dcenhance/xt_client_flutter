<?xml version="1.0" encoding="UTF-8"?>
<!-- Orion Player mark: gold on black, a play glyph with the three belt stars. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130C"/>
      <stop offset="0.55" stop-color="#0B0A0A"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6DFA6"/>
      <stop offset="0.45" stop-color="#E7C275"/>
      <stop offset="1" stop-color="#B98B3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#E7C275" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E7C275" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none"
        stroke="#E7C275" stroke-opacity="0.35" stroke-width="3"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- belt stars -->
  <g fill="url(#gold)">
    <circle cx="196" cy="150" r="13"/>
    <circle cx="256" cy="132" r="16"/>
    <circle cx="316" cy="152" r="11"/>
  </g>
  <g stroke="#E7C275" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <line x1="196" y1="150" x2="256" y2="132"/>
    <line x1="256" y1="132" x2="316" y2="152"/>
  </g>

  <!-- play glyph -->
  <path d="M214 208 L214 344 L340 276 Z" fill="url(#gold)"/>
  <path d="M214 208 L214 344 L340 276 Z" fill="none"
        stroke="#0B0A0A" stroke-opacity="0.25" stroke-width="2"/>
</svg>